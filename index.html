function proj(id){

 A.innerHTML=`<a class="back" href="#/projets">${T(UI.back)}</a>
 <div class="ph" ${col(p.k)}><h1>${T(p.t)}</h1>${tags(p)}<div class="meta"><span><b>${T(UI.c3)}:</b> ${T(p.data)}</span><span><b>${T(UI.c4)}:</b> ${mon(p.d)}</span><span>${T(UI.note)}</span></div></div>
 ${(()=>{const bad=`onerror="(function(i){var f=i.closest('figure'),g=f.parentNode,s=g.closest('section');f.remove();if(g.classList.contains('gal')&&!g.children.length&&s)s.remove()})(this)"`;const fi=j=>b+(j+1)+"."+ext(id),ci=id=="bn"?-1:(COVER[id]||1)-1;
 const cv=p.im.length&&ci>=0?`<figure class="cover${id=="bn"?" sm2":""}"><button data-z="${fi(ci)}" aria-label="${T(p.im[ci])}"><img src="${fi(ci)}" alt="${T(p.im[ci])}" ${id=="bi"?bad:""}></button><figcaption>${T(p.im[ci])}</figcaption></figure>`:"";
 const rest=p.im.map((c,j)=>[c,j]).filter(x=>x[1]!=ci);
 const gal=rest.length?`<section class="pr"><h2>${T(UI.g)}</h2><div class="gal${id=="bn"?" g43":""}">${rest.map(([c,j])=>`<figure><button data-z="${fi(j)}" aria-label="${T(c)}"><img src="${fi(j)}" alt="${T(c)}" loading="lazy" ${id=="bi"?bad:""}></button><figcaption>${T(c)}</figcaption></figure>`).join("")}</div>${p.sn?`<p class="sm" style="margin-top:12px">${T(p.sn)}</p>`:""}</section>`:"";
 return cv+gal})()}
 <section class="pr" ${col(p.k)}><h2>${T(UI.q)}</h2><p>${T(p.q)}</p></section>

const ROUTES={"":"home","parcours":"parcours","projets":"projets","competences":"competences","hobbies":"hobbies","cv":"cv","contact":"contact"};
function go(){
 const m=location.hash.match(/^#\/p\/(\w+)/);
 const r=m?null:(ROUTES[location.hash.replace(/^#\/?/,"")]||"home");
 document.documentElement.lang=lang;
 ["n0","n1","n2","n3","n4","n5","n6"].forEach((x,j)=>{const el=$("#"+x);el.textContent=T(NAV[j]);el.classList.toggle("on",!m&&(r==["home","parcours","projets","competences","hobbies","cv","contact"][j]))});
 document.querySelectorAll(".lg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l==lang));
 if(m)proj(m[1]);
 else ({home,parcours,projets,competences,hobbies,cv,contact})[r]();
}
addEventListener("hashchange",()=>{go();if(location.hash.startsWith("#/p/"))scrollTo(0,0)});
document.addEventListener("click",e=>{const t=e.target.closest("[data-l],[data-f],[data-z]");
 if(!t&&e.target.closest("#lb")){$("#lb").classList.remove("on");return}
 if(!t)return;
 if(t.dataset.l){lang=t.dataset.l;try{localStorage.setItem("hl",lang)}catch(x){}go()}
 else if(t.dataset.f){flt=t.dataset.f;projets()}
 else if(t.dataset.z){const l=$("#lb");l.querySelector("img").src=t.dataset.z;l.classList.add("on")}});
addEventListener("keydown",e=>{if(e.key=="Escape")$("#lb").classList.remove("on")});
go();
</script>
