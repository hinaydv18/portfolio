let lang=(()=>{try{return localStorage.getItem("hl")||(navigator.language||"en").slice(0,2)}catch(e){return "en"}})();if(lang!="fr")lang="en";

 ${list.map(p=>`<a class="tr" href="#/p/${p.id}" ${col(p.k)}><div><h3>${T(p.t)}</h3><p>${T(p.s)}</p></div>${tags(p)}<span class="sm">${T(p.data)}</span><span class="sm">${mon(p.d)}</span></a>`).join("")}</div></section>

 ${SK.map(r=>`<tr><td>${r[0]}</td>${P.map(p=>`<td>${r[1].includes(p.id)?`<span class="dot" ${col(r[2])} role="img" aria-label="yes"></span>`:""}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>
 <section id="about" class="cols"><div><h2>${T(UI.abT)}</h2><p>${T(UI.ab)}</p><p>${T(UI.lang)}</p></div>
 <div class="ct"><h2>Contact</h2><p><a href="mailto:${CONTACT.email}">${CONTACT.email}</a>${CONTACT.linkedin?`<br><a href="${CONTACT.linkedin}">LinkedIn</a>`:""}${CONTACT.github?`<br><a href="${CONTACT.github}">GitHub</a>`:""}</p></div></section>`;

function proj(id){
 const i=P.findIndex(p=>p.id==id),p=P[i];if(!p)return home();
 const nx=P[(i+1)%P.length],pv=P[(i+P.length-1)%P.length],b=`assets/${id}/`;

 <nav class="pn"><a href="#/p/${pv.id}">${T(UI.prev)}</a><a href="#/p/${nx.id}">${T(UI.next)}</a></nav>`;

function go(){const m=location.hash.match(/^#\/p\/(\w+)/);document.documentElement.lang=lang;
 ["n1","n2","n3"].forEach((x,j)=>$("#"+x).textContent=T([UI.projects,UI.skills,UI.about][j]));
 document.querySelectorAll(".lg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l==lang));
 m?proj(m[1]):home();}
addEventListener("hashchange",()=>{go();if(location.hash.startsWith("#/p/"))scrollTo(0,0)});
document.addEventListener("click",e=>{const t=e.target.closest("[data-l],[data-f],[data-z],[data-go]");
 if(!t&&e.target.closest("#lb")){$("#lb").classList.remove("on");return}
 if(!t)return;
 if(t.dataset.l){lang=t.dataset.l;try{localStorage.setItem("hl",lang)}catch(x){}go()}
 else if(t.dataset.f){flt=t.dataset.f;home()}
 else if(t.dataset.z){const l=$("#lb");l.querySelector("img").src=t.dataset.z;l.classList.add("on")}
 else if(t.dataset.go){e.preventDefault();const id=t.dataset.go;const sc=()=>{const el=document.getElementById(id);el&&el.scrollIntoView()};if(location.hash!="#/"&&location.hash!=""){location.hash="#/";setTimeout(sc,50)}else sc()}});
addEventListener("keydown",e=>{if(e.key=="Escape")$("#lb").classList.remove("on")});
go();
