<style>
:root{--bg:#f5f6f2;--surface:#fff;--ink:#14232b;--mute:#52636b;--line:#d9ded8;--teal:#0f6b6b;--gold:#e0a21b;--on-teal:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1f;--surface:#16252c;--ink:#eef1ec;--mute:#9fb0b6;--line:#25383f;--teal:#5cc4bd;--gold:#f0b83a;--on-teal:#0f1a1f}}
:root[data-theme="dark"]{--bg:#0f1a1f;--surface:#16252c;--ink:#eef1ec;--mute:#9fb0b6;--line:#25383f;--teal:#5cc4bd;--gold:#f0b83a;--on-teal:#0f1a1f}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Instrument Sans",system-ui,sans-serif}
body[data-lang=fr] .en,body[data-lang=en] .fr{display:none}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:18px;height:58px}
.brand{font-family:Fraunces,serif;font-weight:700;text-decoration:none;color:var(--ink);margin-right:auto}
nav{display:flex;gap:16px;overflow-x:auto}
nav a{color:var(--mute);text-decoration:none;font-size:15px;white-space:nowrap}
nav a:hover{color:var(--ink)}
.lang button{font:600 13px "Instrument Sans";border:1px solid var(--line);background:var(--surface);color:var(--mute);padding:5px 10px;cursor:pointer}
.lang button:first-child{border-radius:8px 0 0 8px}.lang button:last-child{border-radius:0 8px 8px 0;border-left:0}
body[data-lang=fr] #bfr,body[data-lang=en] #ben{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
section{padding:72px 0;border-bottom:1px solid var(--line)}
.hero{padding:72px 0 56px}
.hero .grid{display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:center}
h1{font-size:clamp(34px,5.2vw,58px);font-weight:700;letter-spacing:-.02em}
.lead{color:var(--mute);font-size:19px;max-width:56ch;margin:20px 0 28px}
.btn{display:inline-block;padding:11px 20px;border-radius:10px;text-decoration:none;font-weight:600;margin:0 10px 10px 0}
.btn.p{background:var(--teal);color:var(--on-teal)}.btn.s{border:1.5px solid var(--teal)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.chart svg{width:100%;height:auto;display:block}
.chart p{margin:8px 0 0;font-size:13px;color:var(--mute)}
.bar{fill:var(--teal);transform-origin:bottom;transform-box:fill-box;animation:grow .9s ease-out both}
.bar.g{fill:var(--gold)}
@keyframes grow{from{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){.bar{animation:none}html{scroll-behavior:auto}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:44px}
.stat{border-top:3px solid var(--gold);padding-top:10px}
.stat b{font:700 30px Fraunces,serif;display:block}.stat span{color:var(--mute);font-size:14px}
h2{font-size:clamp(26px,3.6vw,38px);margin-bottom:10px}
.sub{color:var(--mute);max-width:60ch;margin:0 0 30px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:36px}
.quote{font:500 22px/1.4 Fraunces,serif;border-left:4px solid var(--gold);padding-left:18px;margin:0}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.timeline li{padding:0 0 18px 20px;position:relative}
.timeline li:before{content:"";position:absolute;left:-7px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--teal)}
.timeline small{color:var(--mute);display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:20px}.card p{margin:0;color:var(--mute);font-size:15.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tags span{font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--mute)}
.card.star{border-color:var(--teal)}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.skills h3{font-size:19px;margin-bottom:8px}.skills ul{margin:0;padding-left:18px;color:var(--mute)}
.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.paths div{border-top:3px solid var(--teal);padding-top:10px}.paths b{font-family:Fraunces,serif;font-size:19px;display:block}
.pw{overflow:hidden}
.paper{width:210mm;min-height:297mm;margin:0 auto;background:#fff;color:#14232b;font-size:10.5px;line-height:1.4;box-shadow:0 2px 18px rgba(0,0,0,.18);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ph{background:#0f6b6b;color:#fff;padding:18px 24px;border-bottom:5px solid #e0a21b}
.ph h3{font-size:30px}.ph b{display:block;font-size:12px;margin:2px 0 8px;color:#f0d28a}.ph p{margin:0 0 6px}.ph small{font-size:10px}
.pb{display:grid;grid-template-columns:1.7fr 1fr;gap:22px;padding:16px 24px}
.paper h4{font:600 10.5px "Instrument Sans";letter-spacing:.08em;color:#0f6b6b;margin:14px 0 6px;padding-bottom:3px;border-bottom:1px solid #d9ded8}
.pb>div>h4:first-child{margin-top:0}
.job{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-size:11.5px}.job i{font-style:normal;color:#52636b}
.org{color:#0f6b6b}.paper ul{margin:3px 0 0;padding-left:14px}
@media print{@page{size:A4;margin:0}body *{visibility:hidden}.paper,.paper *{visibility:visible}.paper{position:absolute;left:0;top:0;box-shadow:none}.pw{zoom:1!important}}
footer{padding:36px 0;color:var(--mute);font-size:14px}
@media (max-width:760px){.hero .grid,.two,.paths{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}nav{display:none}section{padding:52px 0}}

nav a.active{color:var(--ink);font-weight:600;border-bottom:2px solid var(--gold)}
.dl{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0 28px}
@media (max-width:760px){header .wrap{flex-wrap:wrap;height:auto;padding-top:8px;padding-bottom:8px}nav{display:flex;order:3;width:100%}}
</style>
